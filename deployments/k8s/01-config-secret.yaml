apiVersion: v1
kind: ConfigMap
metadata:
  name: getfetch-config
  namespace: getfetch
data:
  PORT: "8080"
  NEXT_PUBLIC_API_URL: "/api/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: getfetch-secrets
  namespace: getfetch
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgrespassword@getfetch-postgres:5432/getfetch?sslmode=disable"
  RESEND_API_KEY: ""
  WEBHOOK_URL: ""
  NOTIFY_EMAIL: ""
