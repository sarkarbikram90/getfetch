apiVersion: apps/v1
kind: Deployment
metadata:
  name: getfetch-api
  namespace: getfetch
  labels:
    app: getfetch-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: getfetch-api
  template:
    metadata:
      labels:
        app: getfetch-api
    spec:
      containers:
        - name: api
          image: getfetch/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: getfetch-config
            - secretRef:
                name: getfetch-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: getfetch-api
  namespace: getfetch
  labels:
    app: getfetch-api
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: getfetch-api
