apiVersion: apps/v1
kind: Deployment
metadata:
  name: getfetch-web
  namespace: getfetch
  labels:
    app: getfetch-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: getfetch-web
  template:
    metadata:
      labels:
        app: getfetch-web
    spec:
      containers:
        - name: web
          image: getfetch/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: "http://getfetch-api:8080/api/v1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: getfetch-web
  namespace: getfetch
  labels:
    app: getfetch-web
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: getfetch-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: getfetch-ingress
  namespace: getfetch
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: getfetch-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: getfetch-web
                port:
                  number: 3000
