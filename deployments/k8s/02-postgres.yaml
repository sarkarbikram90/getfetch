apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: getfetch-postgres
  namespace: getfetch
spec:
  serviceName: getfetch-postgres
  replicas: 1
  selector:
    matchLabels:
      app: getfetch-postgres
  template:
    metadata:
      labels:
        app: getfetch-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgrespassword
            - name: POSTGRES_DB
              value: getfetch
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: getfetch-postgres
  namespace: getfetch
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: getfetch-postgres
