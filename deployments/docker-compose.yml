version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: getfetch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: getfetch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d getfetch"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    container_name: getfetch-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/getfetch?sslmode=disable"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
    container_name: getfetch-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/getfetch?sslmode=disable"
    command: ["-loop", "-interval=4h"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.web
    container_name: getfetch-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: getfetch-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
